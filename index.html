<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure{cursor:crosshair}
#plan.tool-plan{cursor:crosshair}
#plan.space-pan{cursor:grab}
#plan.space-pan.panning{cursor:grabbing}
#plan.space-pan *{cursor:grab!important}
#plan.space-pan.panning *{cursor:grabbing!important}
#plan.tool-plan .wall,#plan.tool-plan .room,#plan.tool-plan [data-opening]{pointer-events:all;cursor:move}
#plan.tool-plan .furn{pointer-events:none}
#gEditor [data-wall-handle],#gEditor [data-room-vertex]{cursor:move}
#gEditor [data-opening-body]{cursor:move}
#gEditor [data-opening-corner]{cursor:nwse-resize}
#gEditor [data-opening-edge="0"],#gEditor [data-opening-edge="2"]{cursor:ns-resize}
#gEditor [data-opening-edge="1"],#gEditor [data-opening-edge="3"]{cursor:ew-resize}
#gEditor [data-wall-edge="0"],#gEditor [data-wall-edge="2"]{cursor:ns-resize}
#gEditor [data-wall-edge="1"],#gEditor [data-wall-edge="3"]{cursor:ew-resize}
#plan .wall{pointer-events:none}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
#commandHint{position:absolute;left:50%;top:45px;transform:translateX(-50%);background:#e7f1ff;color:#1555a0;
  border:1px solid #2b73c5;border-radius:7px;padding:4px 10px;font:12px ui-monospace,Menlo,monospace;display:none;pointer-events:none}
#commandHint.show{display:block}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form output{display:block;min-height:30px;border:1px solid #9fc2ee;border-radius:6px;padding:5px 7px;background:#e7f1ff;color:#1555a0;font-weight:600}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.actions .btn.on,.actions .btn.on:hover{background:#e7f1ff;color:#1555a0;border-color:#2b73c5;box-shadow:inset 0 0 0 1px #2b73c5;font-weight:600}
.actions .btn:focus-visible{outline:2px solid #2b73c5;outline-offset:2px}
.actions .btn kbd{margin-left:5px;padding:0;background:transparent;border:0;color:inherit;font-weight:600}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library">◧ 家具库</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨">属性 ◨</button>
    </div>
    <div class="brand"><b data-en="Floor Plan Designer">户型装修设计</b><span id="subtitle">尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg" title="切换 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan">2D 平面</button>
      <button class="btn" data-view="3d" data-en="3D Scene">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)" data-en="Select">选择</button>
      <button class="btn" data-tool="measure" title="测量 (DI)" data-en-title="Measure (DI)" data-en="Measure">测量</button>
      <button class="btn" data-tool="demolish" title="拆改非承重墙 (DE)" data-en-title="Demolish non-bearing walls (DE)" data-en="Demolish">拆改墙体</button>
      <button class="btn" data-tool="plan" title="绘制和修改基础户型 (M / L / PL)" data-en-title="Draw and edit the floor plan (M / L / PL)" data-en="Edit plan">编辑户型</button>
    </div>
    <div class="grp only2d">
      <button class="btn" id="zoomOut" title="缩小" data-en-title="Zoom out">−</button>
      <button class="btn" id="zoomIn" title="放大" data-en-title="Zoom in">＋</button>
      <button class="btn" id="fit" title="适应窗口 (F)" data-en-title="Fit to window (F)" data-en="Fit">适应</button>
      <button class="btn" id="s60" title="按 1:60 显示" data-en-title="Show at 1:60">1:60</button>
      <button class="btn" id="s100" title="按 1:100 显示" data-en-title="Show at 1:100">1:100</button>
    </div>
    <div class="grp only3d" id="modes3d">
      <button class="btn on" data-mode="orbit" data-en="Orbit">鸟瞰</button>
      <button class="btn" data-mode="walk" data-en="Walk">漫游</button>
    </div>
    <div class="grp only3d">
      <button class="btn" id="vIso" data-en="Iso">斜视</button>
      <button class="btn" id="vTop" data-en="Top">俯视</button>
    </div>
    <div class="grp">
      <button class="btn" id="undo" title="撤销 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)" data-en="Undo">撤销</button>
      <button class="btn" id="redo" title="重做 (Ctrl+Shift+Z)" data-en-title="Redo (Ctrl+Shift+Z)" data-en="Redo">重做</button>
      <button class="btn danger" id="clearAll" title="清空所有家具家电（可撤销）" data-en-title="Remove all furniture and appliances (undoable)" data-en="Clear">清空布置</button>
    </div>
    <div class="grp only2d" id="layers">
      <button class="btn chip on" data-layer="dims" data-en="Dims">尺寸</button>
      <button class="btn chip on" data-layer="labels" data-en="Rooms">房间</button>
      <button class="btn chip on" data-layer="furn" data-en="Furniture">家具</button>
      <button class="btn chip" data-layer="grid" data-en="Grid">网格</button>
      <button class="btn chip" data-layer="bearing" data-en="Bearing walls">承重墙</button>
      <button class="btn chip on" data-layer="smartSnap" aria-pressed="true" title="F3 开关；拖动时按 Tab 切换边缘、端点和中心线" data-en-title="F3 toggles; press Tab while dragging to cycle wall edges, endpoints, and centerlines" data-en="Smart snap">智能吸附</button>
    </div>
    <div class="grp">
      <button class="btn chip on" id="snapSound" aria-pressed="true" title="开启或关闭吸附提示音" data-en-title="Toggle snap sound" data-en="Snap sound">吸附音效</button>
    </div>
    <div class="grp only3d">
      <button class="btn chip on" data-cut="2.8" data-en="Full walls">全高墙</button>
      <button class="btn chip" data-cut="1.2" data-en="Cut walls">剖切墙</button>
    </div>
    <div class="grp only3d" id="toggles3d">
      <button class="btn chip on" data-t="furn" data-en="Furniture">家具</button>

const validRect = r => Array.isArray(r) && r.length>=4 && r.slice(0,4).every(Number.isFinite) && r[2]>r[0] && r[3]>r[1];
function validPlan(p){
  return p && ['walls','wins','doors','slides','rooms'].every(k=>Array.isArray(p[k])) &&
    p.walls.every(w=>validRect(w) && ['n','e','b','low'].includes(w[4]) &&
      (w[5] == null || Number.isFinite(w[5]) && w[5]>=100 && w[5]<=6000) &&
      (w[6]===undefined || w[6]==='h' || w[6]==='v')) &&
    p.wins.every(w=>validRect(w) && (w[4]==null || Number.isFinite(w[4]) && w[4]>=0 && w[4]<=6) &&
      (w[5]==null || Number.isInteger(w[5]) && w[5]>=100 && w[5]<=6000) && validOpeningCuts(w[6])) &&
    p.doors.every(d=>validRect(d.rect) && Array.isArray(d.h) && d.h.length===2 && d.h.every(Number.isFinite) &&
      Array.isArray(d.c) && d.c.length===2 && d.c.every(Number.isFinite) && Array.isArray(d.o) && d.o.length===2 && d.o.every(Number.isFinite) && Number.isFinite(d.len) &&
      (d.height===undefined || Number.isInteger(d.height) && d.height>=100 && d.height<=6000) && validOpeningCuts(d.cuts)) &&
    p.slides.every(d=>validRect(d.rect) && typeof d.v==='boolean' && validOpeningCuts(d.cuts)) &&
    p.rooms.every(r=>typeof r.id==='string' && r.id.length>0 && Array.isArray(r.poly) && r.poly.length>=3 &&
      r.poly.every(pt=>Array.isArray(pt) && pt.length===2 && pt.every(Number.isFinite)) &&
      (!r.at || Array.isArray(r.at) && r.at.length===2 && r.at.every(Number.isFinite))) &&
    new Set(p.rooms.map(r=>r.id)).size===p.rooms.length;
}
function validOpeningCuts(cuts){return cuts===undefined || Array.isArray(cuts) && cuts.every(w=>validRect(w) && ['n','e','b','low'].includes(w[4]) &&
  (w[5]==null || Number.isFinite(w[5]) && w[5]>=100 && w[5]<=6000) && (w[6]===undefined || w[6]==='h' || w[6]==='v'));}
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.furniture)) return fixState(s); } catch(e) {}
  return null;
}
function fixState(s){
  const d = defaultState();
  if(s.plan && !validPlan(s.plan)) throw Error('Invalid plan geometry');
  s.plan = s.plan && Array.isArray(s.plan.walls) && Array.isArray(s.plan.rooms) ? s.plan : structuredClone(DEFAULT_PLAN);
  s.plan.wins ||= []; s.plan.doors ||= []; s.plan.slides ||= [];
  s.rooms = Object.assign(d.rooms, s.rooms || {});
  s.plan.rooms.forEach(r => s.rooms[r.id] ||= {name:r.name || '房间', mat:r.mat || 'wood'});
  s.plan.rooms.forEach(r=>{if(!MATS[s.rooms[r.id].mat])s.rooms[r.id].mat=MATS[r.mat]?r.mat:'wood';if(typeof s.rooms[r.id].name!=='string')s.rooms[r.id].name=r.name||'房间';});
  s.demolished = s.demolished || []; s.measures = s.measures || [];
  return s;
}

/* ======================= 几何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const perim = poly => poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + Math.hypot(q[0]-p[0], q[1]-p[1]); }, 0) / 1000;
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;

function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

const ST = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

function furnSVG(t,w,d,c){
  const x = -w/2, y = -d/2, m = Math.min(w,d);
  switch (t){
    case 'bed': {
      let s = rc(x,y,w,d,'#fbf8f2','rx="30"') + rc(x,y,w,Math.min(90,d*.05),shade(c,.62),'rx="20"');
      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');
      const by = py+ph+110, bh = y+d-15-by;
      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));
      return s;
    }
    case 'sofa': case 'armchair': {
      const b = d*.24, a = Math.min(200,w*.13), n = t==='armchair' ? 1 : (w>2200 ? 3 : 2), cw = (w-2*a)/n, dk = shade(c,.85);
      let s = rc(x,y,w,d,dk,'rx="60"');
      for (let i=0;i<n;i++) s += rc(x+a+i*cw,y+b,cw,d-b-40,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,a,d,dk,'rx="50"') + rc(x+w-a,y,a,d,dk,'rx="50"');
    }
    case 'cornersofa': {
      const k = Math.min(950,d*.56,w*.4), b = 220, dk = shade(c,.85);
      let s = pa(`M${x} ${y}H${x+w}V${y+k}H${x+k}V${y+d}H${x}Z`, dk);
      const cw = (w-b-200)/2;
      s += rc(x+b,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b+cw,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b,y+k,k-b-30,d-k-200,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,b,d,dk,'rx="50"') + rc(x+w-200,y,200,k,dk,'rx="50"') + rc(x,y+d-200,k,200,dk,'rx="50"');
    }
    case 'nightstand': return rc(x,y,w,d,c,'rx="30"') + `<circle r="${m*.24}" fill="#fff6dd" ${ST}/>` + `<circle r="${m*.08}" fill="${shade(c,.8)}" ${ST}/>`;
    case 'wardrobe': {
      let s = rc(x,y,w,d,c) + ln(x+50,0,x+w-50,0);

      return s;
    }
    case 'cabinet': case 'shoecab': return rc(x,y,w,d,c) + ln(x,y+d,x+w,y);
    case 'dresser': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.2,y,w*.6,55,'#dfe9ee') + ec(0,d/2+180,160,140,shade(c,.9));
    case 'desk': return rc(x,y,w,d,c,'rx="20"') + rc(-w*.18,y+50,w*.36,45,'#555') + rc(-w*.14,y+d*.45,w*.28,d*.28,'#f4f4f4','rx="10"');
    case 'chair': return rc(x+25,y+d*.16,w-50,d*.84-10,c,'rx="60"') + rc(x,y,w,d*.2,shade(c,.78),'rx="40"');
    case 'bookshelf': { let s = rc(x,y,w,d,c); for (let bx = x+400; bx < x+w-50; bx += 400) s += ln(bx,y,bx,y+d); return s; }
    case 'baycushion': return rc(x,y,w,d,c,'rx="60"') + rc(x+60,y+80,w-120,Math.min(300,d*.2),'#fff','rx="60"') + rc(x+60,y+d-80-Math.min(300,d*.2),w-120,Math.min(300,d*.2),'#fff','rx="60"');
    case 'coffeetable': return rc(x,y,w,d,c,'rx="80"') + rc(x+60,y+60,w-120,d-120,shade(c,1.06),'rx="50"');
    case 'tvstand': return rc(x,y,w,d,c) + rc(x+w*.15,y+30,w*.7,55,'#3a3a3a');
    case 'rug': return rc(x,y,w,d,c,'rx="40" fill-opacity=".6"') + rc(x+90,y+90,w-180,d-180,'none','rx="30" stroke-dasharray="3 3" opacity=".6"');
    case 'plant': {
      let s = `<circle r="${m/2}" fill="${c}" fill-opacity=".85" ${ST}/>`;
      for (let k=0;k<8;k++) s += `<ellipse cx="0" cy="${-m*.27}" rx="${m*.1}" ry="${m*.21}" transform="rotate(${k*45})" fill="${shade(c,.8)}" ${ST}/>`;

    case 'counter': return rc(x,y,w,d,c) + ln(x,y+d-40,x+w,y+d-40,DASH);

    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {

    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {

      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"')

function renderDims(){
  const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  const txt = (x,y,v,rot) => `<text x="${x}" y="${y}" font-size="${v<400?140:200}" text-anchor="middle" fill="${DC}" ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${v}</text>`;
  const chain = (horiz, at, start, segs) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;

    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v) : txt(at-70, mid, v, true); });

  g.innerHTML = x1>x0 && y1>y0 ? chain(true,y0-700,x0,[x1-x0]) + chain(false,x0-700,y0,[y1-y0]) : '';

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${Math.round(L)} mm</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;
  $('#gMeasure').innerHTML = s;
}

/* ======================= 户型绘图 ======================= */
const planSnap = p => ({x:Math.round(p.x), y:Math.round(p.y)});
const planSnapTolerance = () => Math.min(350,14/view.s);
function planWallTargets(exclude=-1){
  return WALLS.filter((w,i)=>i!==exclude && !state.demolished.includes('w'+i));
}
const wallAxisFeatures=(w,axis)=>{
  const a=axis==='x'?0:1,b=axis==='x'?2:3;
  return [{value:w[a],kind:'edge'},{value:w[b],kind:'edge'},
    {value:(w[a]+w[b])/2,kind:axis===(wallIsHorizontal(w)?'y':'x')?'center':'midpoint'}];
};
function nearestPlanValue(raw, fallback, candidates, tol, axis, key){
  const byValue=new Map();
  for(const candidate of candidates){
    const d=Math.abs(candidate.value-raw);
    if(d>=tol)continue;
    const previous=byValue.get(candidate.value);
    if(!previous || candidate.kind==='center' && previous.kind!=='center')
      byValue.set(candidate.value,{...candidate,id:candidate.id||`${candidate.target}:${candidate.kind}:${candidate.value}`,distance:d});
  }
  const options=[...byValue.values()].sort((a,b)=>a.distance-b.distance || (a.kind==='center'?-1:b.kind==='center'?1:0));
  if(drag?.kind?.startsWith('plan-') && options.length)(drag.snapGroups ||= []).push({key,axis,options});
  const chosen=options.find(c=>drag?.snapOverride?.key===key && drag.snapOverride.id===c.id) || options[0];
  return {value:chosen?chosen.value:fallback,
    guide:chosen?{axis,value:chosen.target,kind:chosen.kind,key,id:chosen.id,choice:options.indexOf(chosen)+1,count:options.length}:null};
}
function snapPlanDrawPoint(p,horizontal,slot='draw-end'){
  const q=planSnap(p);
  if(!ui.layers.smartSnap)return {...q,guides:[]};
  const tol=planSnapTolerance(), half=ui.wallWidth/2;
  const xs=[],ys=[];
  for(const w of planWallTargets()){
    for(const f of wallAxisFeatures(w,'x')){
      if(horizontal)xs.push({value:f.value,target:f.value,kind:f.kind});
      else if(f.kind==='center')xs.push({value:f.value,target:f.value,kind:f.kind});
      else for(const offset of [-half,half])xs.push({value:f.value+offset,target:f.value,kind:f.kind});
    }
    for(const f of wallAxisFeatures(w,'y')){
      if(!horizontal)ys.push({value:f.value,target:f.value,kind:f.kind});
      else if(f.kind==='center')ys.push({value:f.value,target:f.value,kind:f.kind});
      else for(const offset of [-half,half])ys.push({value:f.value+offset,target:f.value,kind:f.kind});
    }
  }
  const x=nearestPlanValue(p.x,q.x,xs,tol,'x',`${slot}:x`),y=nearestPlanValue(p.y,q.y,ys,tol,'y',`${slot}:y`);
  return {x:x.value,y:y.value,guides:[x.guide,y.guide].filter(Boolean)};
}
function snapPlanWallMove(rect,index){
  if(!ui.layers.smartSnap){ui.snapGuides=[];return rect;}
  const tol=planSnapTolerance(), xs=[],ys=[];
  for(const w of planWallTargets(index)){
    for(const axis of ['x','y']){
      const candidates=axis==='x'?xs:ys;
      for(const [si,source] of wallAxisFeatures(rect,axis).entries())for(const [ti,target] of wallAxisFeatures(w,axis).entries()){
        if(source.kind===target.kind)
          candidates.push({value:target.value-source.value,target:target.value,kind:target.kind,id:`${w.join(',')}:${si}:${ti}`});
      }
    }
  }
  const dx=nearestPlanValue(0,0,xs,tol,'x','move:x'),dy=nearestPlanValue(0,0,ys,tol,'y','move:y');
  ui.snapGuides=[dx.guide,dy.guide].filter(Boolean);
  return [rect[0]+dx.value,rect[1]+dy.value,rect[2]+dx.value,rect[3]+dy.value];
}
function snapPlanWallEdge(p,index,edge){
  const q=planSnap(p);
  if(!ui.layers.smartSnap){ui.snapGuides=[];return q;}
  const axis=edge===0||edge===2?'y':'x',candidates=[];
  for(const w of planWallTargets(index))for(const f of wallAxisFeatures(w,axis))
    candidates.push({value:f.value,target:f.value,kind:f.kind});
  const snapped=nearestPlanValue(p[axis],q[axis],candidates,planSnapTolerance(),axis,`resize:${axis}`);
  ui.snapGuides=snapped.guide?[snapped.guide]:[];
  return {...q,[axis]:snapped.value};
}
function openingWallHost(p,slot,length=0){
  if(!ui.layers.smartSnap)return null;
  const tol=planSnapTolerance(),byTrack=new Map();
  WALLS.forEach((wall,index)=>{

const PANES = 'huxing-panes';
const panes = (() => { try { return JSON.parse(localStorage.getItem(PANES)) || {}; } catch(e) { return {}; } })();
function drawer(which, open){
  const app = $('.app'), els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  if (n){
    Object.entries(els).forEach(([k, el]) => el.classList.toggle('open', k === which && (open ?? !el.classList.contains('open'))));
  } else {
    Object.values(els).forEach(el => el.classList.remove('open'));
    if (which){
      const k = which === 'lib' ? 'hideLib' : 'hidePanel';
      panes[k] = open === undefined ? !panes[k] : !open;
      try { localStorage.setItem(PANES, JSON.stringify(panes)); } catch(e) {}
    }
  }
  app.classList.toggle('hide-lib', !!panes.hideLib); app.classList.toggle('hide-panel', !!panes.hidePanel);
  syncPaneBtns();
}
function syncPaneBtns(){
  const els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  const vis = k => n ? els[k].classList.contains('open') : !panes[k === 'lib' ? 'hideLib' : 'hidePanel'];
  $('#tgLib').classList.toggle('on', vis('lib')); $('#tgPanel').classList.toggle('on', vis('panel'));
  $('#tgLib').title = vis('lib') ? tr('收起家具库 ( [ )', 'Hide library ( [ )') : tr('展开家具库 ( [ )', 'Show library ( [ )');
  $('#tgPanel').title = vis('panel') ? tr('收起属性面板 ( ] )', 'Hide properties ( ] )') : tr('展开属性面板 ( ] )', 'Show properties ( ] )');

// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 4; n++){
    let moved = false;
    for (const r of snapRects()){
      const {hw, hh} = aabb(f), ox = Math.min(f.cx+hw, r[2]) - Math.max(f.cx-hw, r[0]), oy = Math.min(f.cy+hh, r[3]) - Math.max(f.cy-hh, r[1]);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) f.cx = f.cx < (r[0]+r[2])/2 ? r[0]-hw : r[2]+hw;
      else f.cy = f.cy < (r[1]+r[3])/2 ? r[1]-hh : r[3]+hh;
      moved = true;
    }
    if (!moved) return;
  }
}
function addItem(it, x, y){
  const [type,name,w,d,color] = it, f = F(type,name,Math.round(x/10)*10,Math.round(y/10)*10,w,d,0,color);
  pushOut(f);
  ui.sel = {kind:'furn', id:f.id};
  mutate(() => type==='rug' ? state.furniture.unshift(f) : state.furniture.push(f));

}

  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;

function fitView(){

let snapAudioContext=null, lastSnapSoundAt=-Infinity;
function prepareSnapAudio(){
  if(!ui.snapSound)return;
  const AudioContextClass=window.AudioContext || window.webkitAudioContext;
  if(!AudioContextClass)return;
  try{
    snapAudioContext ||= new AudioContextClass();
    if(snapAudioContext.state==='suspended')snapAudioContext.resume().catch(()=>{});
  }catch(e){}
}
function playSnapSound(){
  if(!ui.snapSound || !ui.layers.smartSnap || performance.now()-lastSnapSoundAt<140)return;
  prepareSnapAudio();
  const context=snapAudioContext;
  if(!context || context.state!=='running')return;
  lastSnapSoundAt=performance.now();
  const start=context.currentTime, oscillator=context.createOscillator(), volume=context.createGain();
  oscillator.type='triangle';

  oscillator.frequency.linearRampToValueAtTime(420,start+.075);
  volume.gain.setValueAtTime(0,start);
  volume.gain.linearRampToValueAtTime(.025,start+.008);
  volume.gain.linearRampToValueAtTime(0,start+.09);
  oscillator.connect(volume);volume.connect(context.destination);

}

const grid = () => 10;
function snapMove(f, cx, cy, feedback){
  let nx = Math.round(cx/grid())*grid(), ny = Math.round(cy/grid())*grid();
  if (!ui.layers.smartSnap){trackSnapSound(feedback,'');return [nx, ny];}
  const {hw, hh} = aabb(f), tol = 10/view.s;
  let bx = tol, by = tol, xTarget='', yTarget='';
  for (const r of snapRects()){
    if (!(r[3] < cy-hh-tol || r[1] > cy+hh+tol)) for (const ex of [r[0], r[2]]) for (const c of [ex+hw, ex-hw]) if (Math.abs(c-cx) < bx){ bx = Math.abs(c-cx); nx = c; xTarget=`x:${ex}`; }
    if (!(r[2] < cx-hw-tol || r[0] > cx+hw+tol)) for (const ey of [r[1], r[3]]) for (const c of [ey+hh, ey-hh]) if (Math.abs(c-cy) < by){ by = Math.abs(c-cy); ny = c; yTarget=`y:${ey}`; }
  }

function snapPoint(p, shift){

    for (const ey of [r[1], r[3]]) if (Math.abs(ey-p.y) < by){ by = Math.abs(ey-p.y); y = ey; }

    const room = e.target.closest && e.target.closest('[data-room]');
    $('#hover').innerHTML = room ? `<b>${esc(state.rooms[room.dataset.room].name)}</b> ${fmt(area(ROOMS.find(r=>r.id===room.dataset.room).poly))} m²` : '';
    if (ui.tool === 'measure' && ui.mA){ ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); }
    return;
  }
  if(drag.kind.startsWith('plan-')){
    updatePlanDrag(p,e.clientX,e.clientY);return;
  }
  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if (drag.kind === 'measure'){
    if (far) drag.moved = true;
    ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); return;
  }
  if (drag.kind === 'pan'){
    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }
  const f = getF(drag.id); if (!f) return;
  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy, drag);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;
    f.rot = norm(e.shiftKey ? a : Math.round(a/15)*15);
  } else if (drag.kind === 'size'){
    const a = f.rot*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const dx = p.x-f.cx, dy = p.y-f.cy, lx = dx*c + dy*s, ly = -dx*s + dy*c;
    const ax = -f.w/2, ay = -f.d/2;
    const nw = Math.max(100, Math.round((lx-ax)/10)*10), nd = Math.max(100, Math.round((ly-ay)/10)*10);
    const mx = ax + nw/2, my = ay + nd/2;
    f.cx += mx*c - my*s; f.cy += mx*s + my*c; f.w = nw; f.d = nd;
  }
  renderFurn(); renderSel();
});

function onPointerEnd(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2) pinch = null; return; }   // 双指结束后，剩下的手指不再触发操作
  endDrag(e.type === 'pointercancel');
}
svg.addEventListener('pointerup', onPointerEnd);
svg.addEventListener('pointercancel', onPointerEnd);
// 阻止 iPad Safari 把双指手势当成整页缩放
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(view.s*Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
svg.addEventListener('dblclick', e => { if(ui.tool==='plan' && ui.planTool==='room' && ui.draftPoly.length>=3){
  const q=snapPlanRoomPoint(toMM(e));
  if(ui.draftPoly.length && Math.hypot(q.x-ui.draftPoly.at(-1)[0],q.y-ui.draftPoly.at(-1)[1])>=50)ui.draftPoly.push([q.x,q.y]);
  finishRoom();return;
} if (ui.tool==='select' && e.target.closest('[data-fid]')) rotateSel(90); });
svg.addEventListener('contextmenu', e => { if (ui.tool==='measure'){ e.preventDefault(); ui.mA = null; renderMeasure(); } });


/* ======================= 键盘 ======================= */
const cadAliases={
  pl:()=>setPlanTool('room'),
  dr:()=>setPlanTool('door'), wi:()=>setPlanTool('window'), sl:()=>setPlanTool('slide'),
  di:()=>setTool('measure'), de:()=>setTool('demolish'),
  co:()=>duplicateSel(), ro:shift=>rotateSel(shift?-90:90), ze:()=>fitView()
};
let cadPrefix='', cadTimer;
function clearCadPrefix(){
  cadPrefix=''; clearTimeout(cadTimer); $('#commandHint').classList.remove('show'); $('#commandHint').textContent='';
}
document.addEventListener('pointerdown',clearCadPrefix,true);
function cadLetter(k,shift){
  const alias=cadPrefix+k;
  if(cadPrefix && cadAliases[alias]){clearCadPrefix();cadAliases[alias](shift);return true;}
  clearCadPrefix();
  if(Object.keys(cadAliases).some(a=>a.startsWith(k))){
    cadPrefix=k; $('#commandHint').textContent=k.toUpperCase()+'…'; $('#commandHint').classList.add('show');
    cadTimer=setTimeout(clearCadPrefix,1500);return true;
  }
  if(k==='m'){setPlanTool('select');return true;}
  if(k==='l'){setPlanTool('wall');return true;}
  if(k==='v'){setTool('select');return true;}
  if(k==='e'){deleteSel();return true;}
  if(k==='t'){setView(is3D()?'2d':'3d');return true;}
  if(k==='f'){fitView();return true;}
  return false;
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea,[contenteditable]') && e.key!=='F3' &&
      !(drag?.kind?.startsWith('plan-') && e.key==='Tab')){clearCadPrefix();return;}
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if(e.key==='F3' && !mod && !e.altKey && !is3D()){
    e.preventDefault();if(e.repeat)return;
    clearCadPrefix();toggleSmartSnap();
    toast(ui.layers.smartSnap?tr('智能吸附已开启','Smart snap on'):tr('智能吸附已关闭','Smart snap off'));
    return;
  }
  if(e.code==='Space' && !mod && !e.altKey && !is3D()){
    e.preventDefault();clearCadPrefix();
    if(!drag){spacePan=true;svg.classList.add('space-pan');}
    return;
  }
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod || e.altKey) {clearCadPrefix();return;}
  if(k==='tab' && drag?.kind?.startsWith('plan-') && !is3D()){
    e.preventDefault();clearCadPrefix();prepareSnapAudio();cyclePlanSnap(e.shiftKey);return;
  }
  if (k === '[' || k === ']'){ drawer(k === '[' ? 'lib' : 'panel'); return; }
  if (k === 'f' && e.shiftKey){ toggleFullscreen(); return; }
  if(k==='escape'){
    if(cadPrefix){clearCadPrefix();return;}
    if(ui.tool==='plan'){
      if(ui.draftPoly.length){ui.draftPoly=[];ui.draftCursor=null;renderEditor();}
      else if(ui.planTool!=='select')setPlanTool('select');
      else{ui.sel=null;renderAll();}
    } else if(ui.mA){ui.mA=null;renderMeasure();}
    else{if(ui.tool!=='select')setTool('select');select(null);}
    return;
  }
  if(k==='enter' && ui.tool==='plan' && ui.planTool==='room'){e.preventDefault();clearCadPrefix();finishRoom();return;}
  if(is3D() && k!=='t')return;
  if(/^[a-z]$/.test(k)){
    if(e.repeat)return;
    if(cadLetter(k,e.shiftKey))e.preventDefault();
    return;
  }
  clearCadPrefix();
  if (k === 'delete' || k === 'backspace'){ e.preventDefault(); deleteSel(); }
  else if (k.startsWith('arrow') && ui.sel?.kind === 'furn'){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => { const f = getF(ui.sel.id); if (k==='arrowleft') f.cx -= st; if (k==='arrowright') f.cx += st; if (k==='arrowup') f.cy -= st; if (k==='arrowdown') f.cy += st; });
  }
  else if (k === '+' || k === '=') zoomCenter(1.25);
  else if (k === '-') zoomCenter(.8);
});
document.addEventListener('keyup',e=>{
  if(e.code!=='Space')return;
  if(spacePan){
    spacePan=false;svg.classList.remove('space-pan');
    if(drag?.temp)endDrag(false);
    e.preventDefault();
  }
});
window.addEventListener('blur',()=>{
  spacePan=false;svg.classList.remove('space-pan');
  if(drag?.temp)endDrag(false);
});

/* ======================= 家具库 ======================= */
function buildLib(){
  $('#lib').innerHTML = LIB.map((c,ci) => `<h4>${nm(c.cat)}</h4><div class="lib-grid">${c.items.map((it,ii) => {
    const [t,n,w,d,col] = it, pad = Math.max(w,d)*.08;
    return `<div class="item" data-key="${ci}:${ii}" title="${tr('点击添加，或拖到平面图中的指定位置', 'Click to add, or drag onto the plan')}">
      <svg viewBox="${-w/2-pad} ${-d/2-pad} ${w+2*pad} ${d+2*pad}">${furnSVG(t,w,d,col)}</svg><b>${esc(nm(n))}</b><small>${w}×${d}</small></div>`;
  }).join('')}</div>`).join('') + `<div class="hint">${tr(
    `家具按真实尺寸（mm）绘制。${COARSE ? '点一下放到画面中央，或按住向右拖到平面图 / 3D 地面上的指定位置（上下滑动为滚动列表）。' : '点击添加到画面中央，或直接拖到平面图 / 3D 地面上。'}添加后可在右侧修改宽深与颜色。`,
    `Furniture is drawn at real size (mm). ${COARSE ? 'Tap to place at the center, or hold and drag right onto the plan / 3D floor (swipe up/down to scroll).' : 'Click to add at the center, or drag onto the plan / 3D floor.'} Edit size and color in the right panel afterwards.`)}</div>`;
  document.querySelectorAll('.item').forEach(el => el.addEventListener('pointerdown', e => {
    if (e.button) return;
    libDrag = {el, id:e.pointerId, sx:e.clientX, sy:e.clientY, it:itemOf(el), ghost:null};
  }));
}
const itemOf = el => { const [ci, ii] = el.dataset.key.split(':').map(Number); return LIB[ci].items[ii]; };

// 家具库拖放：用 pointer 事件实现（iPad 上 HTML5 拖放不可靠）。
// 列表设置了 touch-action:pan-y，竖向滑动交给浏览器滚动（会触发 pointercancel），横向拖动才开始拖放。
let libDrag = null;
// 屏幕坐标 → 户型坐标（mm）。2D 取平面图坐标，3D 取射线与地面的交点；s = 该处每 mm 的屏幕像素数
function dropPoint(x, y){
  const r = $('#stage').getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
  if (is3D()) return window.View3D?.groundAt(x, y) || null;
  const p = toMM({clientX:x, clientY:y}); return {x:p.x, y:p.y, s:view.s};
}
addEventListener('pointermove', e => {
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const {it} = libDrag;
  if (!libDrag.ghost){
    if (Math.hypot(e.clientX-libDrag.sx, e.clientY-libDrag.sy) < TAP) return;
    const g = libDrag.ghost = document.createElement('div'); g.id = 'ghost';
    g.innerHTML = `<svg viewBox="${-it[2]/2} ${-it[3]/2} ${it[2]} ${it[3]}">${furnSVG(it[0],it[2],it[3],it[4])}</svg>`;
    document.body.appendChild(g); libDrag.el.classList.add('dragging');
  }
  // 幽灵图按落点处的比例显示真实大小（3D 中近大远小）
  const g = libDrag.ghost, s = Math.max(dropPoint(e.clientX, e.clientY)?.s || (is3D() ? .05 : view.s), .02);
  Object.assign(g.style, {width:Math.max(28, it[2]*s)+'px', height:Math.max(20, it[3]*s)+'px', left:e.clientX+'px', top:e.clientY+'px'});
  const lib = $('aside.lib');
  if (narrow() && lib.classList.contains('open') && e.clientX > lib.getBoundingClientRect().right) drawer(null);   // 拖出抽屉后自动收起
});
function endLibDrag(e, ok){
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const d = libDrag; libDrag = null;
  d.el.classList.remove('dragging');
  if (d.ghost){
    d.ghost.remove();
    if (!ok) return;
    const p = dropPoint(e.clientX, e.clientY);
    if (p) addItem(d.it, p.x, p.y);
    else if (is3D() && e.clientX > $('#stage').getBoundingClientRect().left) toast(tr('请拖到地面上', 'Drop it on the floor'));
    return;
  }
  if (!ok) return;
  // 轻点：放到选中房间中心，否则放到画面中心（3D 取屏幕中心对应的地面位置）
  let p = null;
  if (ui.sel?.kind === 'room'){ const b = bbox(ROOMS.find(r => r.id===ui.sel.id).poly); p = {x:(b[0]+b[2])/2, y:(b[1]+b[3])/2}; }
  else if (is3D()){ const r = $('#stage').getBoundingClientRect(); p = window.View3D.groundAt(r.left + r.width/2, r.top + r.height/2); }
  if (!p) p = {x:view.x0 + svg.clientWidth/2/view.s, y:view.y0 + svg.clientHeight/2/view.s};
  addItem(d.it, p.x, p.y);
  closeDrawers();
}
addEventListener('pointerup', e => endLibDrag(e, true));
addEventListener('pointercancel', e => endLibDrag(e, false));

function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportPNG(){
  if (is3D()) return window.View3D.shot();
  const clone = svg.cloneNode(true), W = 3200, H = Math.round(W*BOUNDS.h/BOUNDS.w);
  clone.setAttribute('viewBox', `${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${BOUNDS.h}`);
  clone.setAttribute('width', W); clone.setAttribute('height', H);
  clone.querySelector('#gSel').innerHTML = '';
  clone.querySelector('#gEditor').innerHTML = '';
  clone.querySelector('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid?'url(#grid)':'#f7f4ee'}"/>`;
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  Object.entries({x:-20000,y:-20000,width:55000,height:55000,fill:'#f7f4ee'}).forEach(([k,v]) => bg.setAttribute(k,v));
  clone.insertBefore(bg, clone.querySelector('#gGrid'));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0, W, H);
    cv.toBlob(b => download(tr('户型装修方案', 'floor-plan-design') + '.png', b));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
}

/* ======================= 2D / 3D 切换 ======================= */
let viewMode = '2d', switching = false;
const is3D = () => viewMode === '3d';
const TIPS = () => COARSE
  ? {'2d':tr('点或拖动家具库添加 · 单指拖动平移 · 双指缩放 · 选中家具后底部工具条可旋转 / 复制 / 删除', 'Tap or drag from the library · 1 finger pans · pinch zooms · bottom bar rotates / duplicates / deletes'),
     '3d':tr('点墙体修改尺寸和高度 · 单指旋转 · 双指缩放 / 平移 · 点门开关', 'Tap a wall to edit its size and height · 1 finger orbits · 2 fingers zoom / pan · tap doors to open')}
  : {'2d':tr('按住空格拖动画布 · 智能吸附对齐墙边和中心线 · 滚轮缩放 · T 切换 3D', 'Hold Space to pan · Smart snap aligns wall edges and centerlines · scroll to zoom · T for 3D'),
     '3d':tr('点击墙体修改高度 · 右侧修改会立即生效 · T 返回 2D', 'Click a wall to edit its height · panel changes apply instantly · T for 2D')};
async function setView(m){
  if (m === viewMode || switching) return;

/* 全屏：标准 API + Safari（iPad）的 webkit 前缀版本 */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFullscreen(){
  const de = document.documentElement;
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!req) return toast(tr('当前浏览器不支持网页全屏，可在 Safari 中「添加到主屏幕」后以全屏方式打开', 'Fullscreen is not supported here — in Safari, use "Add to Home Screen" to open it fullscreen'));
    Promise.resolve(req.call(de)).catch(() => toast(tr('无法进入全屏', 'Could not enter fullscreen')));
  }
}
function syncFullscreen(){
  const on = !!fsEl(), b = $('#fullscreen');
  b.textContent = '⛶ ' + (on ? tr('退出全屏', 'Exit fullscreen') : tr('全屏', 'Fullscreen'));
  b.title = (on ? tr('退出全屏', 'Exit fullscreen') : tr('全屏', 'Fullscreen')) + ' (Shift+F)';
}

// 横竖屏切换、表头换行等都会改变画布尺寸；尺寸从 0 恢复（如首次布局）时重新适应窗口
// 其余尺寸变化（收起 / 展开面板等）保持画面中心不动

new ResizeObserver(() => {
  const w = svg.clientWidth, h = svg.clientHeight; if (!w) return;

  else { view.x0 -= (w - lastW)/2/view.s; view.y0 -= (h - lastH)/2/view.s; applyView(); }
  lastW = w; lastH = h;
}).observe(svg);

function setLang(l){
  LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch(e) {}

applyStaticLang(); syncFullscreen(); syncSnapSoundButton();
buildDefs(); buildLib(); renderOpenings(); renderDims();

fitView(); renderAll();

<script type="module">
/* ============================================================
 *  3D 场景（three.js）—— 与 2D 共用 state / ui，切换时带过渡动画：
 *  2D → 3D：3D 相机先以正俯视对齐当前 2D 视口（比例、位置一致），
 *           交叉淡入后镜头倾斜环绕、墙体从地面升起、家具随后立起；
 *  3D → 2D：反向——家具收起、墙体下沉、镜头回到正俯视并淡出到平面图。
 * ============================================================ */
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const stage = $('#stage'), host = $('#view3d');
const H = 2.8, FOV = 45;
const OX = () => BOUNDS.x + BOUNDS.w/2, OY = () => BOUNDS.y + BOUNDS.h/2;
const wx = x => (x - OX()) / 1000, wz = y => (y - OY()) / 1000, M = v => v / 1000;
const SW = () => stage.clientWidth, SH = () => stage.clientHeight;
const opt = {cut:2.8, furn:true, labels:true, night:false, hour:10, mode:'orbit'};

let inited = false, active = false, raf = 0, anim = null, fly = null;
let renderer, labelRenderer, scene, camera, orbit, walkCtl, hemi, sun, ground, glassMat, wallMat, capMat, frameMat;
let archFloor, archUp, furnG, labelG, lampG, colliders = [], selKey = null, selHelper = null;
let sigArch = '', sigFurn = '', sigLabels = '', grow = 1, furnGrow = 1;
const doors = [], keys = {};

/* ======================= 初始化 ======================= */
function init(){
  if (inited) return; inited = true;
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(SW(), SH());
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  host.prepend(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(SW(), SH());
  Object.assign(labelRenderer.domElement.style, {position:'absolute', inset:'0', pointerEvents:'none'});
  host.appendChild(labelRenderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, SW()/SH(), .05, 300);
  orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI*.495; orbit.minDistance = 1.5; orbit.maxDistance = 45;
  walkCtl = new PointerLockControls(camera, document.body);
  walkCtl.addEventListener('lock', () => { $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'block'; });
  walkCtl.addEventListener('unlock', () => { if (opt.mode === 'walk'){ $('#walkOverlay').style.display = 'flex'; $('#cross').style.display = 'none'; } });

  hemi = new THREE.HemisphereLight(0xfff8ee, 0xb9a88f, 1.1);
  sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.setScalar(COARSE ? 2048 : 4096);   // 平板 GPU 用小一点的阴影贴图
  Object.assign(sun.shadow.camera, {left:-11, right:11, top:11, bottom:-11, near:1, far:60});
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({color:0xf2eee7, roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.015; ground.receiveShadow = true;
  scene.add(hemi, sun, sun.target, ground);

  const pm = new THREE.PMREMGenerator(renderer); envTex = pm.fromScene(new RoomEnvironment(), .04).texture; pm.dispose();
  glassMat = new THREE.MeshPhysicalMaterial({color:0xcfe6ef, roughness:.05, transparent:true, opacity:.28, depthWrite:false, side:THREE.DoubleSide});
  wallMat = mat('#f4f1eb', {roughness:.92}); capMat = mat('#34312d', {roughness:.9}); frameMat = mat('#5d6166', {roughness:.5, metalness:.4});

  archFloor = new THREE.Group(); archUp = new THREE.Group(); furnG = new THREE.Group(); labelG = new THREE.Group(); lampG = new THREE.Group();
  scene.add(archFloor, archUp, furnG, labelG, lampG);

  const cv = renderer.domElement; let downAt = null, look = null;
  cv.addEventListener('pointerdown', e => {
    prepareSnapAudio();
    downAt = [e.clientX, e.clientY]; window.closeDrawers();
    if (touchWalk && !look){ look = {id:e.pointerId, x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', e => {
    if (!look || e.pointerId !== look.id) return;
    lookBy(e.clientX - look.x, e.clientY - look.y); look.x = e.clientX; look.y = e.clientY;
  });
  cv.addEventListener('pointercancel', e => { if (look?.id === e.pointerId) look = null; });

  // 按住已选中的家具拖动：沿地面摆放（与 2D 共用网格和智能吸附）。
  // 在父元素上用捕获阶段监听，赶在 OrbitControls 之前关掉它，避免同时旋转镜头
  let fdrag = null;
  host.addEventListener('pointerdown', e => {
    if (e.target !== cv || !e.isPrimary || anim || opt.mode !== 'orbit' || ui.sel?.kind !== 'furn') return;
    const h = pick(e), f = h?.fid === ui.sel.id && getF(h.fid), g = f && groundAt(e.clientX, e.clientY);
    if (!g) return;
    fdrag = {id:f.id, pid:e.pointerId, sx:e.clientX, sy:e.clientY, ox:g.x - f.cx, oy:g.y - f.cy, before:snap(), moved:false};
    orbit.enabled = false; fly = null; cv.setPointerCapture(e.pointerId);
  }, true);
  cv.addEventListener('pointermove', e => {
    if (!fdrag || e.pointerId !== fdrag.pid) return;
    if (!fdrag.moved && Math.hypot(e.clientX - fdrag.sx, e.clientY - fdrag.sy) < TAP) return;
    const f = getF(fdrag.id), g = groundAt(e.clientX, e.clientY); if (!f || !g) return;
    fdrag.moved = true; cv.style.cursor = 'grabbing';
    [f.cx, f.cy] = snapMove(f, g.x - fdrag.ox, g.y - fdrag.oy, fdrag);
    furnG.children.find(o => o.userData.fid === f.id)?.position.set(wx(f.cx), 0, wz(f.cy));   // 拖动中只挪模型，松手再整体同步
  });
  const endF = e => {
    if (!fdrag || e.pointerId !== fdrag.pid) return;
    const d = fdrag; fdrag = null; orbit.enabled = true; cv.style.cursor = '';
    if (d.moved){ commit(d.before); renderAll(); }
  };
  cv.addEventListener('pointerup', endF); cv.addEventListener('pointercancel', endF);

  cv.addEventListener('pointerup', e => {
    const tap = downAt && Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) <= TAP;
    if (look?.id === e.pointerId){
      look = null;
      if (tap){ const h = pick(e); if (h?.door && h.dist < 3.5) h.door.open = !h.door.open; }   // 漫游时点门开关
      return;
    }
    if (anim || opt.mode !== 'orbit' || !tap) return;
    const h = pick(e);
    if (h?.door){h.door.open = !h.door.open;window.select({kind:'opening',type:'door',index:h.door.index});}
    else if(h?.opening)window.select({kind:'opening',type:h.opening.type,index:h.opening.index});
    else if (h?.fid) window.select({kind:'furn', id:h.fid});
    else if (h?.wallIndex !== undefined) window.select({kind:'wall',index:h.wallIndex});
    else if (h?.room) window.select({kind:'room', id:h.room});
    else window.select(null);
  });
  new ResizeObserver(() => {
    renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH());
    camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  }).observe(stage);
  bindUI();
}

/* ======================= 材质 ======================= */
const matCache = new Map();
let envTex = null, envK = 1;
function mat(color, o = {}){
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)){
    const m = new THREE.MeshStandardMaterial({color, roughness:.7, ...o});
    // 金属 / 光滑表面挂环境反射，墙面等哑光材质不挂，避免整体变亮
    if (envTex && (m.metalness > 0 || m.roughness < .4)){ m.envMap = envTex; m.userData.env = m.metalness > .5 ? 1 : .5; m.envMapIntensity = m.userData.env*envK; }
    matCache.set(key, m);
  }
  return matCache.get(key);
}
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgbK = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v*k))); return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`; };
// 地面贴图按真实尺寸平铺（UV 单位 = 米）
const TEX = {
  wood:{sx:1.8, sy:.36, base:'#d6b58a', rough:.55}, walnut:{sx:1.8, sy:.36, base:'#9a6f4b', rough:.5},
  tile800:{sx:.8, sy:.8, base:'#ebe6dd', grout:'#cfc6b7', rough:.3}, tile600:{sx:.6, sy:.6, base:'#dfe3e0', grout:'#bfc6c1', rough:.35},
  antislip:{sx:.3, sy:.3, base:'#d3d8d4', grout:'#aab2ac', rough:.8}, marble:{sx:1.2, sy:1.2, base:'#f2efe9', grout:'#d9d2c4', rough:.18},
  terrazzo:{sx:.5, sy:.5, base:'#e6dfd3', rough:.4}, carpet:{sx:.3, sy:.3, base:'#c6bfd2', rough:1},
};
const floorMats = {};
function floorMat(kind){
  if (floorMats[kind]) return floorMats[kind];
  const s = TEX[kind] || TEX.tile800, R = rng(kind.length*977 + 13), cv = document.createElement('canvas');
  const wood = kind === 'wood' || kind === 'walnut';
  cv.width = wood ? 1024 : 512; cv.height = wood ? 205 : 512;
  const g = cv.getContext('2d'), W = cv.width, Hh = cv.height;
  g.fillStyle = s.base; g.fillRect(0, 0, W, Hh);
  if (wood){
    const rowH = Hh/2, joints = [[W*2/3], [W/3]];
    for (let r = 0; r < 2; r++){
      let x0 = 0;
      [...joints[r], W].forEach(x1 => {
        g.fillStyle = rgbK(s.base, .9 + R()*.2); g.fillRect(x0, r*rowH, x1-x0, rowH);
        g.strokeStyle = rgbK(s.base, .8); g.globalAlpha = .35; g.lineWidth = 1.2;
        for (let k = 0; k < 7; k++){ const y = r*rowH + 6 + R()*(rowH-12); g.beginPath(); g.moveTo(x0, y);
          for (let x = x0; x <= x1; x += 40) g.lineTo(x, y + Math.sin(x*.02 + k)*2.5); g.stroke(); }
        g.globalAlpha = 1; g.fillStyle = rgbK(s.base, .62); g.fillRect(x1-1.5, r*rowH, 3, rowH); x0 = x1;
      });
      g.fillStyle = rgbK(s.base, .62); g.fillRect(0, r*rowH, W, 2.5);
    }
  } else if (kind === 'marble'){
    g.strokeStyle = 'rgba(160,150,135,.35)';
    for (let k = 0; k < 6; k++){ g.lineWidth = 1 + R()*3; g.beginPath(); g.moveTo(R()*W, 0); g.bezierCurveTo(R()*W, R()*Hh, R()*W, R()*Hh, R()*W, Hh); g.stroke(); }
  } else if (kind === 'terrazzo'){
    const cs = ['#b9a58c','#8fa3a0','#c9b7a2','#a88f76','#7e8a86'];
    for (let k = 0; k < 160; k++){ g.fillStyle = cs[k%5]; g.beginPath(); g.arc(R()*W, R()*Hh, 2 + R()*7, 0, 7); g.fill(); }
  } else {
    for (let k = 0; k < 1500; k++){ g.fillStyle = `rgba(0,0,0,${R()*.04})`; g.fillRect(R()*W, R()*Hh, 2, 2); }
  }
  if (s.grout){ g.fillStyle = s.grout; g.fillRect(0, 0, W, 3); g.fillRect(0, 0, 3, Hh); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/s.sx, 1/s.sy);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return floorMats[kind] = new THREE.MeshStandardMaterial({map:t, roughness:s.rough});
}

/* ======================= 几何小工具（y = 底面高度） ======================= */
const asMat = m => typeof m === 'string' ? mat(m) : m;
const sh = o => { o.castShadow = o.receiveShadow = true; return o; };
const mesh = (geo, m) => sh(new THREE.Mesh(geo, asMat(m)));
const rot = (o, x = 0, y = 0, z = 0) => { o.rotation.set(x, y, z); return o; };
function box(w, h, d, m, x = 0, y = 0, z = 0){
  const o = mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h/2, z); return o;
}
function rbox(w, h, d, m, x = 0, y = 0, z = 0, r = .04){
  const o = mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w/2-.001, h/2-.001, d/2-.001)), m); o.position.set(x, y + h/2, z); return o;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, seg = 28){
  const o = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.position.set(x, y + h/2, z); return o;
}
// 旋转体：pts = [[半径, 高度], …] 自下而上，y = 底面
function lathe(pts, m, x = 0, y = 0, z = 0, seg = 40){
  const o = mesh(new THREE.LatheGeometry(pts.map(([r, h]) => new THREE.Vector2(Math.max(r, 1e-4), h)), seg), m); o.position.set(x, y, z); return o;
}
// 两点之间的圆杆，r0 在 a 端、r1 在 b 端（收分椅腿、斜撑）
function rod(a, b, r0, m, r1 = r0, seg = 12){
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), o = mesh(new THREE.CylinderGeometry(r1, r0, A.distanceTo(B), seg), m);
  o.position.copy(A).add(B).multiplyScalar(.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize()); return o;
}
// 沿曲线的圆管（水龙头、扶手、灯臂）
const tube = (pts, r, m, seg = 40) => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'centripetal'), seg, r, 10), m);
// 椭球（靠垫、叶片、豆袋），y = 中心
function blob(rx, ry, rz, m, x = 0, y = 0, z = 0, seg = 24){
  const o = mesh(new THREE.SphereGeometry(1, seg, Math.round(seg*.7)), m); o.scale.set(rx, ry, rz); o.position.set(x, y, z); return o;
}
// 水平圆环，y = 中心
function ring(R, r, m, x = 0, y = 0, z = 0){ const o = mesh(new THREE.TorusGeometry(R, r, 10, 48), m); o.rotation.x = Math.PI/2; o.position.set(x, y, z); return o; }
function rrect(w, d, r){
  const s = new THREE.Shape(), x = -w/2, y = -d/2; r = Math.min(r, w/2 - .001, d/2 - .001);
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
// 中空圆角框（浴缸、水槽沿、椅背框）：外 w×d、壁厚 t、高 h
function shell(w, d, h, t, r, m, x = 0, y = 0, z = 0){
  const s = rrect(w, d, r); s.holes.push(rrect(w - 2*t, d - 2*t, Math.max(.004, r - t)));
  const geo = new THREE.ExtrudeGeometry(s, {depth:h, bevelEnabled:false, curveSegments:10}); geo.rotateX(-Math.PI/2);
  const o = mesh(geo, m); o.position.set(x, y, z); return o;
}
const darker = (hex, k = .8) => '#' + new THREE.Color(hex).multiplyScalar(k).getHexString();
const lighter = (hex, k = .2) => '#' + new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), k).getHexString();
// 四条收分腿：inset 为距边距离，r 为腿底半径（顶部略粗）
const legs = (g, w, d, h, m, inset = .05, r = .02) => [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a, b]) => g.add(rod([a*(w/2-inset), 0, b*(d/2-inset)], [a*(w/2-inset), h, b*(d/2-inset)], r*.7, m, r)));
const metal = () => mat('#cfd2d4', {metalness:.9, roughness:.25});
const chrome = () => mat('#eef0f2', {metalness:1, roughness:.08});
const hwMat = () => mat('#b9b3a8', {metalness:.85, roughness:.3});
const blackMetal = () => mat('#2b2b2d', {metalness:.6, roughness:.4});
const mirror = () => mat('#dfeaee', {metalness:.55, roughness:.06});
const ceramic = (o = {}) => mat('#fbfbf9', {roughness:.12, ...o});
const fabric = c => mat(c, {roughness:.96});
const woodM = c => mat(c, {roughness:.55});
const screenMat = (glow = '#1a2636') => mat('#0b0e13', {roughness:.1, metalness:.3, emissive:glow, emissiveIntensity:.35});
const glowMat = (c = '#fff4dc', e = '#ffdca0', k = .5) => mat(c, {emissive:e, emissiveIntensity:k, roughness:.9, side:THREE.DoubleSide});

// 拉手：y 为拉手中心，z 为门板正面
function pull(g, len, vert, x, y, z){
  const m = hwMat(), o = new THREE.Group();
  o.add(vert ? box(.01, len, .01, m, 0, -len/2, .028) : box(len, .01, .01, m, 0, -.005, .028));
  [-1, 1].forEach(s => o.add(vert ? box(.008, .008, .028, m, 0, s*(len/2 - .015) - .004, .014) : box(.008, .008, .028, m, s*(len/2 - .015), -.004, .014)));
  o.position.set(x, y, z); g.add(o);
}
function knob(g, x, y, z){ const k = cyl(.011, .014, .02, hwMat(), x, y - .01, z + .01, 16); k.rotation.x = Math.PI/2; g.add(k, blob(.014, .014, .008, hwMat(), x, y, z + .022, 12)); }
// 柜门 / 抽屉面板：x0..x0+w、y0..y0+h 区域内 nx 列 × ny 行，正面朝 +z（z = 柜体正面）
// hd：'bar' 金属拉手 | 'knob' 圆钮 | 'edge' 顶部隐形拉槽 | 'none'；hy：门拉手中心高度（null = 面板中部）
function fronts(g, x0, y0, w, h, z, nx, ny, m, hd = 'bar', hy = null){
  const gap = .005, pw = w/nx, ph = h/ny, fz = z + .018;
  g.add(box(w, h, .002, '#2a2724', x0 + w/2, y0, z + .001));                     // 缝隙里透出的暗色
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++){
    const cx = x0 + pw*(i + .5), yb = y0 + ph*j, drawer = ph < .4 && pw >= ph;
    g.add(rbox(pw - gap, ph - gap, .018, m, cx, yb + gap/2, z + .009, .003));
    if (hd === 'none') continue;
    if (hd === 'edge'){ g.add(box(pw - .05, .01, .006, '#3c3a37', cx, yb + ph - gap - .018, fz)); continue; }
    if (drawer){ hd === 'knob' ? knob(g, cx, yb + ph/2, fz) : pull(g, Math.min(.3, pw*.45), false, cx, yb + ph/2, fz); continue; }
    const len = Math.min(.45, ph*.35), hx = nx === 1 ? cx + pw/2 - .045 : (i % 2 ? cx - pw/2 + .04 : cx + pw/2 - .04);
    const y = Math.min(yb + ph - .05 - len/2, Math.max(yb + .05 + len/2, hy ?? yb + ph/2));
    hd === 'knob' ? knob(g, hx, y, fz) : pull(g, len, true, hx, y, fz);
  }
}
const vasePts = (r, h) => [[0, 0], [r*.65, 0], [r, h*.32], [r*.92, h*.62], [r*.42, h*.86], [r*.5, h]];
function vase(g, x, y, z, r, h, c, R, flowers = true){
  g.add(lathe(vasePts(r, h), mat(c, {roughness:.35, side:THREE.DoubleSide}), x, y, z, 32));
  if (!flowers) return;
  const cols = ['#f3e6d8', '#e8b4a0', '#f6d27a', '#ffffff'];
  for (let k = 0; k < 5; k++){
    const a = k*1.26 + R()*.4, s = .03 + R()*.05, top = [x + Math.cos(a)*s, y + h + .12 + R()*.14, z + Math.sin(a)*s];
    g.add(rod([x, y + h*.6, z], top, .003, '#6f8f4a', .003, 6), blob(.022, .018, .022, cols[k % 4], ...top, 12));
  }
}
function tableLamp(g, x, y, z, s = 1){
  g.add(lathe([[0, 0], [.06*s, 0], [.075*s, .05*s], [.08*s, .12*s], [.055*s, .2*s], [.018*s, .25*s], [.012*s, .3*s]], ceramic({roughness:.3}), x, y, z, 32));
  g.add(lathe([[.13*s, 0], [.1*s, .18*s]], glowMat('#f6ecd9', '#ffdca0', .35), x, y + .26*s, z, 40), blob(.03*s, .03*s, .03*s, glowMat('#fff', '#ffe2b0', 1), x, y + .31*s, z, 12));
}
const plate = (g, r, x, y, z) => g.add(lathe([[0, 0], [r*.6, 0], [r*.72, .008], [r, .02]], ceramic({side:THREE.DoubleSide}), x, y, z, 32));

/* ======================= 家具模型（局部坐标：背面朝 -z） ======================= */
function buildFurniture(f){
  const g = new THREE.Group(), w = M(f.w), d = M(f.d), c = f.color || '#ddd', bz = -d/2, R = rng(Math.round(f.w*7 + f.d*13 + f.cx + f.cy));
  switch (f.type){
    case 'bed': {

/* ======================= 建筑 ======================= */
function clearGroup(g){ g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); g.clear(); }
function wallBox([x0, y0, x1, y1], yb, yt, m, wallIndex){
